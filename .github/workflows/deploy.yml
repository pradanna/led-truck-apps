name: 🚀 Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy LED-FLX to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔍 Detect changed files
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          echo "--- Changed files ---"
          echo "$CHANGED"
          echo "---------------------"

          FRONTEND_COUNT=$(echo "$CHANGED" | grep -cE '\.(jsx?|tsx?|css|vue)$' || true)
          echo "frontend=${FRONTEND_COUNT:-0}" >> $GITHUB_OUTPUT

          PHP_COUNT=$(echo "$CHANGED" | grep -cE '(\.php$|composer\.json$|composer\.lock$)' || true)
          echo "php=${PHP_COUNT:-0}" >> $GITHUB_OUTPUT

          MIGRATION_COUNT=$(echo "$CHANGED" | grep -c 'database/migrations/' || true)
          echo "migrations=${MIGRATION_COUNT:-0}" >> $GITHUB_OUTPUT

          echo "Frontend: ${FRONTEND_COUNT:-0} | PHP: ${PHP_COUNT:-0} | Migrations: ${MIGRATION_COUNT:-0}"

      - name: 🔐 Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          FRONTEND_CHANGED: ${{ steps.changes.outputs.frontend }}
          PHP_CHANGED: ${{ steps.changes.outputs.php }}
          MIGRATIONS_CHANGED: ${{ steps.changes.outputs.migrations }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: FRONTEND_CHANGED,PHP_CHANGED,MIGRATIONS_CHANGED
          script_stop: false  # Biarkan bash 'set -e' yang handle, bukan drone-ssh
          script: |
            set -e  # Stop on error (bash native, tidak ganggu if-conditions)

            # Export PATH agar composer/php/npm tersedia di non-interactive shell
            export PATH="$PATH:/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" || true

            FRONTEND_CHANGED=${FRONTEND_CHANGED:-0}
            PHP_CHANGED=${PHP_CHANGED:-0}
            MIGRATIONS_CHANGED=${MIGRATIONS_CHANGED:-0}

            echo "🚀 Starting deployment..."
            echo "📊 Changes - Frontend: $FRONTEND_CHANGED | PHP: $PHP_CHANGED | Migrations: $MIGRATIONS_CHANGED"
            cd ${{ secrets.VPS_PATH }}

            # ── Validasi .env ───────────────────────────────────────────
            if [ ! -f ".env" ]; then
              echo "❌ File .env tidak ditemukan!"
              echo "   Upload dulu: scp .env.production ubuntu@103.93.129.80:/var/www/youseemobileled.com/.env"
              exit 1
            fi
            echo "✅ .env ditemukan"

            # ── Pull latest code ────────────────────────────────────────
            echo "📦 Pulling latest code..."
            git pull --no-rebase origin main

            # ── Composer: jalankan jika vendor/ belum ada ATAU php berubah
            if [ ! -d "vendor" ] || [ "$PHP_CHANGED" -gt "0" ]; then
              echo "🔧 Running composer install..."
              composer install --no-dev --optimize-autoloader --no-interaction
              php artisan optimize:clear
            else
              echo "⏩ vendor/ sudah ada & tidak ada PHP changes - skipping composer"
            fi

            # ── NPM: jalankan jika node_modules/ belum ada ATAU frontend berubah
            if [ ! -d "node_modules" ] || [ "$FRONTEND_CHANGED" -gt "0" ]; then
              echo "🎨 Running npm install & build..."
              npm ci --prefer-offline
              npm run build
            else
              echo "⏩ node_modules/ sudah ada & tidak ada frontend changes - skipping npm"
            fi

            # ── Migrations ──────────────────────────────────────────────
            if [ "$MIGRATIONS_CHANGED" -gt "0" ]; then
              echo "🗄️  New migrations - running migrate..."
              php artisan migrate --force
            else
              echo "⏩ No new migrations"
            fi

            # ── Cache artisan ───────────────────────────────────────────
            echo "⚡ Caching config, routes, views..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Uncomment jika pakai PHP-FPM:
            # sudo systemctl reload php8.2-fpm

            # Uncomment jika pakai queue worker via Supervisor:
            # php artisan queue:restart

            echo ""
            echo "✅ Deploy selesai: $(date '+%Y-%m-%d %H:%M:%S %Z')"
